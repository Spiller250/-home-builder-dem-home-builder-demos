<style>
/* Layout: night-map first. The region map is full-bleed; a floating list panel on the left, a commute switcher on top, a detail panel that slides in on the right, a compare tray along the bottom. Phones: map on top, list below, details in a bottom sheet. */
:root{
  --bg:#0A111D; --panel:#0F1828; --panel-2:#142036; --ink:#E9EEF6; --muted:#8A97AC; --line:#1D2A41;
  --land:#0E1726; --land-2:#111C2E; --water:#0B2B44; --water-edge:#164466; --park:#10261E; --road:#22314A; --street:#18243A; --hwy:#6B5A3E; --hwy-core:#B9853F;
  --accent:#F4A259; --accent-ink:#1A1206; --soon:#7FB2F0; --final:#E8C468; --sold:#5D6A80; --good:#6FD3A4;
  --shadow:0 18px 40px -16px rgba(0,0,0,.75), 0 2px 8px rgba(0,0,0,.35);
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body:"Hanken Grotesk", "Avenir Next", "Segoe UI", sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#EEF1F5; --panel:#FFFFFF; --panel-2:#F5F7FA; --ink:#121A27; --muted:#5D687A; --line:#DCE2EA;
  --land:#F1F3F0; --land-2:#E9EDE6; --water:#BBD6E8; --water-edge:#9CC2DB; --park:#D5E6CF; --road:#FFFFFF; --street:#E3E7E1; --hwy:#E2B66F; --hwy-core:#F6D49A;
  --accent:#C2561A; --accent-ink:#FFFFFF; --soon:#2F6DB5; --final:#A77A0E; --sold:#8A95A5; --good:#1F8A5B;
  --shadow:0 16px 36px -16px rgba(18,26,39,.35), 0 2px 6px rgba(18,26,39,.08);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#EEF1F5; --panel:#FFFFFF; --panel-2:#F5F7FA; --ink:#121A27; --muted:#5D687A; --line:#DCE2EA;
  --land:#F1F3F0; --land-2:#E9EDE6; --water:#BBD6E8; --water-edge:#9CC2DB; --park:#D5E6CF; --road:#FFFFFF; --street:#E3E7E1; --hwy:#E2B66F; --hwy-core:#F6D49A;
  --accent:#C2561A; --accent-ink:#FFFFFF; --soon:#2F6DB5; --final:#A77A0E; --sold:#8A95A5; --good:#1F8A5B;
  --shadow:0 16px 36px -16px rgba(18,26,39,.35), 0 2px 6px rgba(18,26,39,.08);
  color-scheme:light}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{position:relative;height:100%;overflow:hidden}
#map{position:absolute;inset:0;background:var(--land);isolation:isolate;z-index:0}
.leaflet-container{background:var(--land);font-family:var(--f-body)}

/* map styling */
.land2{fill:var(--land-2);fill-opacity:1;stroke:none}
.water{fill:var(--water);fill-opacity:1;stroke:var(--water-edge);stroke-width:1}
.park{fill:var(--park);fill-opacity:1;stroke:none}
.street{stroke:var(--street);fill:none;stroke-linecap:round}
.road{stroke:var(--road);fill:none;stroke-linecap:round;stroke-linejoin:round}
.hwy{stroke:var(--hwy);fill:none;stroke-linecap:round;stroke-linejoin:round}
.hwy-core{stroke:var(--hwy-core);fill:none;stroke-linecap:round;stroke-linejoin:round}
.runway{fill:var(--road);fill-opacity:1;stroke:none}
.route{stroke:var(--accent);stroke-width:3;stroke-dasharray:1 8;stroke-linecap:round;fill:none}
.ring{stroke:var(--accent);stroke-width:1.2;stroke-dasharray:4 6;fill:var(--accent);fill-opacity:.05}

.ringlbl{transform:translate(-50%,-50%);font-size:11px;font-weight:700;color:var(--accent);white-space:nowrap;pointer-events:none;background:var(--panel);padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.town{font-family:var(--f-display);font-variation-settings:"wdth" 80;font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);white-space:nowrap;transform:translate(-50%,-50%);pointer-events:none;opacity:.85}
.town.big{font-size:13px;color:var(--ink);opacity:.7}
.water-lbl{font-style:italic;font-size:11px;color:var(--water-edge);white-space:nowrap;transform:translate(-50%,-50%);pointer-events:none;letter-spacing:.06em}
.shield{transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:700;font-size:10px;line-height:1;padding:3px 5px 2px;border-radius:4px;background:var(--hwy-core);color:var(--accent-ink);white-space:nowrap;pointer-events:none;border:1.5px solid var(--hwy)}
.shield.us{border-radius:50%;padding:4px 4px 3px;min-width:20px;text-align:center}
.poi{transform:translate(-11px,-11px);display:flex;align-items:center;gap:6px;white-space:nowrap;pointer-events:none}
.poi i{width:22px;height:22px;border-radius:7px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.poi svg{width:13px;height:13px;fill:none;stroke:var(--muted);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.poi span{font-size:11px;color:var(--muted);font-weight:500}
.poi.dest i{background:var(--accent);border-color:var(--accent)}
.poi.dest svg{stroke:var(--accent-ink)}
.poi.dest span{color:var(--ink);font-weight:700}
.far .poi span,.far .poi.school{display:none}
.far .poi.dest span{display:inline}

.pin{all:unset;cursor:pointer;position:absolute;left:0;top:0;transform:translate(-50%,calc(-100% - 6px));display:flex;align-items:center;gap:6px;padding:6px 7px 6px 10px;border-radius:14px;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);white-space:nowrap;font-weight:700;font-size:12.5px;transition:transform .18s ease, background .18s}
.pin:after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:inherit;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.pin i{width:10px;height:10px;border-radius:50%;flex:none}
.pin.now i{background:var(--accent)} .pin.final i{background:var(--final)} .pin.soon i{background:transparent;border:2px solid var(--soon)} .pin.sold i{background:var(--sold)}
.pin.sold{color:var(--muted);font-weight:500}
.pin:hover,.pin.hot{transform:translate(-50%,calc(-100% - 9px)) scale(1.06);z-index:2}
.pin.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pin.sel:after{border-color:var(--accent)}
.pin.sel i{background:var(--accent-ink)}
.pin.off{opacity:.3}
.pin .pn{display:flex;flex-direction:column;line-height:1.15}
.pin .pn b{font-size:12.5px}
.pin .pn small{font-size:11px;font-weight:500;opacity:.8}
.far .pin .pn b{display:none}
.far .pin .pn small{font-size:12px;font-weight:700;opacity:1}
.pin .mins{font-weight:600;font-size:11px;padding:1px 6px;border-radius:999px;background:var(--panel-2);color:var(--ink)}
.pin.sel .mins{background:rgba(0,0,0,.18);color:var(--accent-ink)}
.leaflet-marker-icon.pinwrap{overflow:visible}

.leaflet-bar{border:1px solid var(--line)!important;box-shadow:var(--shadow)!important;border-radius:12px!important;overflow:hidden}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-bottom-color:var(--line)}
.leaflet-bar a:hover{background:var(--panel-2)}

/* floating list panel */
.list{position:absolute;z-index:600;top:16px;left:16px;bottom:16px;width:380px;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.list-head{padding:22px 22px 14px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
h1{margin:4px 0 0;font-family:var(--f-display);font-weight:700;font-variation-settings:"wdth" 82,"opsz" 72;font-size:34px;line-height:.98;letter-spacing:-.015em;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted);font-size:13px}
.filters{display:flex;flex-direction:column;gap:10px}
.frow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.frow label,.frow .k{font-size:12px;color:var(--muted);flex:none}
.frow output{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--panel-2)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chip i{width:8px;height:8px;border-radius:50%}
.cards{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0}

// arterials
const ART=[
 [[520,985],[600,930],[760,880],[880,800],[1000,700]],
 [[1385,1170],[1300,1060],[1240,940],[1150,820],[1000,700]],
 [[760,770],[860,740],[1000,700]],
 [[420,430],[520,500],[700,590],[850,640],[1000,700]],
 [[1500,365],[1380,450],[1220,560],[1100,640],[1000,700]],
 [[1725,705],[1600,690],[1400,700],[1200,700],[1000,700]],
 [[1220,990],[1240,940]],
 [[1000,700],[1000,1400]],[[1000,700],[1000,0]],
 [[1660,245],[1580,330],[1500,365]],
];
const artLines=ART.map(a=>spline(a,10));
// highways
const I18=spline([[-80,540],[300,560],[600,585],[860,640],[1000,625],[1200,600],[1500,560],[1800,520],[2080,510]],12);
const H27=spline([[1080,-80],[1050,200],[1030,450],[1040,700],[1060,950],[1110,1200],[1150,1480]],12);
const LOOP=(()=>{const p=[];for(let i=0;i<=120;i++){const a=i/120*Math.PI*2;p.push([1000+Math.cos(a)*470,700+Math.sin(a)*330])}return p})();
const roadLayers=[];
function road(pts,kind){
  if(kind==='hwy'){roadLayers.push([PL(pts,'hwy',6),'hwy'],[PL(pts,'hwy-core',3),'core'])}
  else roadLayers.push([PL(pts,'road',2.5),'art']);
}
artLines.forEach(a=>road(a,'art'));
road(LOOP,'art');road(I18,'hwy');road(H27,'hwy');
function sizeRoads(){const z=map.getZoom(),f=Math.pow(2,(z+1)*.55);roadLayers.forEach(([l,t])=>l.setStyle({weight:t==='hwy'?Math.max(4,7*f):t==='core'?Math.max(2,3.6*f):Math.max(1.5,2.6*f)}))}
// airport runways
add(L.polygon([[230,1590],[244,1600],[300,1735],[286,1745]].map(([y,x])=>[y,x]),{className:'runway',interactive:false}));
add(L.polygon([[268,1600],[278,1606],[214,1720],[204,1712]].map(([y,x])=>[y,x]),{className:'runway',interactive:false}));

// labels
const lbl=(xy,html,cls)=>add(L.marker(ll(xy),{interactive:false,keyboard:false,icon:L.divIcon({className:'',html:`<div class="${cls}">${html}</div>`,iconSize:[0,0]})}));
lbl([1000,760],'Downtown','town big');
[['Millbrook',[400,1080]],['North Ridge',[1300,1250]],['Riverside',[690,820]],['Pine Bluff',[300,520]],['Southgate',[1560,450]],['Eastgate',[1830,760]],['University District',[840,500]]].forEach(([t,xy])=>lbl(xy,t,'town'));
lbl([1620,1080],'Silver Lake','water-lbl');lbl([300,812],'Cedar River','water-lbl');lbl([330,250],'Pine Bluff State Park','water-lbl" style="color:var(--muted)');
lbl([360,561],'I-18','shield');lbl([1720,521],'I-18','shield');lbl([1045,330],'27','shield us');lbl([1078,1080],'27','shield us');
POI.forEach(p=>lbl(p.xy,`<i><svg viewBox="0 0 24 24">${ICON[p.ic]}</svg></i><span>${p.name}</span>`,'poi '+(p.cls||'')));
const destMarkers=new Map();
DEST.forEach(d=>destMarkers.set(d.id,lbl(d.xy,`<i><svg viewBox="0 0 24 24">${ICON[d.ic]}</svg></i><span>${d.name}</span>`,'poi')));

// ---------- state
const state={dest:'downtown',custom:null,max:700000,beds:0,status:new Set(['now','final','soon']),sel:null,cmp:new Set(),picking:false};
const destXY=()=>state.dest==='custom'?state.custom:DEST.find(d=>d.id===state.dest).xy;
const destName=()=>state.dest==='custom'?'your workplace':(DEST.find(d=>d.id===state.dest).short||DEST.find(d=>d.id===state.dest).name).toLowerCase().replace('downtown','downtown');
let customMarker=null,routeLine=null,ringLayer=null,ringLabel=null;

// segmented control
const seg=document.getElementById('seg');
seg.insertAdjacentHTML('beforeend',DEST.map(d=>`<button data-d="${d.id}" aria-pressed="${d.id===state.dest}">${d.short||d.name}</button>`).join('')+`<button data-d="custom" aria-pressed="false">Pick on map</button>`);
seg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset.d;
  if(d==='custom'){state.picking=true;document.getElementById('app').classList.add('picking');document.getElementById('pickhint').hidden=false;if(!state.custom){setPressed('custom');return}}
  else{state.picking=false;document.getElementById('app').classList.remove('picking');document.getElementById('pickhint').hidden=true}
  state.dest=d;setPressed(d);refresh()});
function setPressed(d){seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.d===d))}
map.on('click',e=>{if(!state.picking)return;state.custom=[e.latlng.lng,e.latlng.lat];state.dest='custom';state.picking=false;
  document.getElementById('app').classList.remove('picking');document.getElementById('pickhint').hidden=true;setPressed('custom');
  if(customMarker)customMarker.remove();customMarker=lbl(state.custom,`<i><svg viewBox="0 0 24 24">${ICON.pin}</svg></i><span>Your workplace</span>`,'poi dest');refresh()});

// filters
const price=document.getElementById('price'),priceOut=document.getElementById('priceOut');
price.addEventListener('input',()=>{state.max=+price.value;refresh()});
document.getElementById('beds').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;state.beds=+b.dataset.b;document.querySelectorAll('#beds .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));refresh()});
document.getElementById('stat').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;const s=b.dataset.s;state.status.has(s)?state.status.delete(s):state.status.add(s);b.setAttribute('aria-pressed',state.status.has(s));refresh()});
const passes=c=>state.status.has(c.status)&&c.price[0]<=state.max&&c.beds[1]>=state.beds;

// pins
const pins=new Map();
COMM.forEach(c=>{
  const m=add(L.marker(ll(c.xy),{icon:L.divIcon({className:'pinwrap',html:'',iconSize:[0,0]}),keyboard:false,riseOnHover:true}));
  pins.set(c.id,m);
});
function pinHTML(c){
  const t=drive(c.xy,destXY()).min;
  const label=c.status==='soon'?'Coming soon':c.status==='sold'?'Sold out':`from ${k(c.price[0])}`;
  return `<button class="pin ${c.status} ${state.sel===c.id?'sel':''} ${passes(c)?'':'off'}" data-id="${c.id}" aria-label="${c.name}, ${STATUS[c.status]}"><i></i><span class="pn"><b>${c.name.replace(/^The /,'')}</b><small>${label}</small></span><span class="mins">${t} min</span></button>`;
}
document.getElementById('map').addEventListener('click',e=>{const b=e.target.closest('.pin');if(b){e.stopPropagation();select(b.dataset.id,true)}},true);
document.getElementById('map').addEventListener('mouseover',e=>{const b=e.target.closest('.pin');if(b)hot(b.dataset.id,true)});
document.getElementById('map').addEventListener('mouseout',e=>{const b=e.target.closest('.pin');if(b)hot(b.dataset.id,false)});

// thumbnails: a small elevation sketch per community, tinted by its own hue
function art(c,big){
  const h=c.hue,sky=`hsl(${h} 45% 22%)`,sky2=`hsl(${h+30} 50% 34%)`,ground=`hsl(${h} 25% 14%)`,wall=`hsl(${h} 30% 88%)`,roof=`hsl(${h} 35% 30%)`,win='hsl(38 95% 66%)';
  const W=big?390:72,H=big?150:72;const s=big?1.25:.42;const ox=big?110:4,oy=big?150:66;
  let house='';
  const one=(x,w,ht,pitch)=>`<rect x="${x}" y="${-ht}" width="${w}" height="${ht}" fill="${wall}"/><path d="M${x-6} ${-ht} L${x+w/2} ${-ht-pitch} L${x+w+6} ${-ht}Z" fill="${roof}"/><rect x="${x+w*.18}" y="${-ht*.62}" width="${w*.2}" height="${ht*.26}" fill="${win}"/><rect x="${x+w*.6}" y="${-ht*.62}" width="${w*.2}" height="${ht*.26}" fill="${win}"/><rect x="${x+w*.42}" y="${-ht*.34}" width="${w*.16}" height="${ht*.34}" fill="${roof}"/>`;
  if(c.type==='Townhomes')house=one(0,46,52,22)+one(48,46,52,22)+one(96,46,52,22);
  else if(c.type==='Luxury estates')house=one(0,70,58,30)+one(66,90,74,36);
  else house=one(10,84,60,34)+`<rect x="98" y="-38" width="44" height="38" fill="${wall}"/><path d="M95 -38 L120 -54 L145 -38Z" fill="${roof}"/>`;
  const trees=[[-22,0,16],[170,0,20],[200,0,13]].map(([x,y,r])=>`<circle cx="${x}" cy="${y-r}" r="${r}" fill="hsl(150 22% ${18+(x%3)*4}%)"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="g${c.id}${big?1:0}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky}"/><stop offset="1" stop-color="${sky2}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#g${c.id}${big?1:0})"/><circle cx="${W*.8}" cy="${H*.3}" r="${big?16:7}" fill="hsl(40 90% 75%)" opacity=".9"/><g transform="translate(${ox} ${oy-(big?12:4)}) scale(${s})">${trees}${house}</g><rect y="${H-(big?12:4)}" width="${W}" height="${big?12:4}" fill="${ground}"/></svg>`;
}

// list
const cards=document.getElementById('cards');
function renderList(){
  const list=COMM.filter(passes).map(c=>({c,t:drive(c.xy,destXY())})).sort((a,b)=>a.t.min-b.t.min);
  cards.innerHTML=list.length?list.map(({c,t})=>`<div class="card ${state.sel===c.id?'sel':''}" data-id="${c.id}" role="button" tabindex="0" aria-label="${c.name}">
    <span class="thumb">${art(c,false)}</span>
    <span style="min-width:0">
      <span class="c-top"><span class="c-name">${c.name}</span><span class="c-mins">${t.min} min</span></span>
      <div class="c-meta">${c.status==='soon'?'Expected from '+k(c.price[0]):k(c.price[0])+'–'+k(c.price[1])} · ${c.beds[0]}–${c.beds[1]} bd · ${c.type}</div>
      <span class="c-foot"><span class="badge b-${c.status}"><i></i>${STATUS[c.status]}${c.status==='now'||c.status==='final'?` · ${c.left} left`:''}</span>
      <label class="cmp"><input type="checkbox" data-cmp="${c.id}" ${state.cmp.has(c.id)?'checked':''}>Compare</label></span>
    </span></div>`).join(''):`<div class="none">No communities match. Raise the price limit or turn on more statuses.</div>`;
}
cards.addEventListener('click',e=>{if(e.target.closest('.cmp'))return;const c=e.target.closest('.card');if(c)select(c.dataset.id,true)});
cards.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card')){e.preventDefault();select(e.target.dataset.id,true)}});
cards.addEventListener('change',e=>{const id=e.target.dataset.cmp;if(!id)return;if(e.target.checked){if(state.cmp.size>=3){e.target.checked=false;flashTray('Compare up to 3 communities');return}state.cmp.add(id)}else state.cmp.delete(id);tray()});
cards.addEventListener('mouseover',e=>{const c=e.target.closest('.card');if(c)hot(c.dataset.id,true)});
cards.addEventListener('mouseout',e=>{const c=e.target.closest('.card');if(c)hot(c.dataset.id,false)});
function hot(id,on){document.querySelector(`.pin[data-id="${id}"]`)?.classList.toggle('hot',on);cards.querySelector(`.card[data-id="${id}"]`)?.classList.toggle('hot',on)}

// detail
const detail=document.getElementById('detail');
function select(id,fly){
  state.sel=id;const c=COMM.find(x=>x.id===id);
  renderDetail(c);detail.classList.add('open');if(window.innerWidth<=860)window.scrollTo({top:0,behavior:'smooth'});document.getElementById('app').classList.add('dopen');detail.setAttribute('aria-hidden','false');
  if(fly){const wide=window.innerWidth>860;const z=Math.max(map.getZoom(),-1);
    const pt=map.project(ll(c.xy),z).add([wide?-10:0,wide?0:60]);map.flyTo(map.unproject(pt,z),z,{duration:.6})}
  refresh();
}
function closeDetail(){detail.classList.remove('open');document.getElementById('app').classList.remove('dopen');detail.setAttribute('aria-hidden','true');state.sel=null;refresh()}
document.getElementById('dClose').addEventListener('click',closeDetail);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!document.getElementById('modal').hidden)closeModal();else closeDetail()}});

function near(c,ic){return POI.filter(p=>p.ic===ic).map(p=>({p,t:drive(c.xy,p.xy)})).sort((a,b)=>a.t.mi-b.t.mi)[0]}
function renderDetail(c){
  document.getElementById('dHero').innerHTML=art(c,true);
  const sold=c.total-c.left;
  const times=DEST.map(d=>({d,t:drive(c.xy,d.xy)}));
  if(state.custom)times.push({d:{id:'custom',name:'Your workplace',ic:'pin'},t:drive(c.xy,state.custom)});
  const sch=near(c,'school'),groc=near(c,'cart'),park=near(c,'tree');
  const showPlan=c.siteplan&&/github\.io$|netlify\.app$|vercel\.app$/.test(location.hostname)||c.siteplan&&location.protocol==='file:';
  let h=`<div><span class="badge b-${c.status}"><i></i>${STATUS[c.status]}</span><h2>${c.name}</h2><div class="sub" style="margin:0">${c.area} · ${c.type} · ${c.plans} floor plans</div></div>
  <div class="price">${c.status==='soon'?'Expected from '+money(c.price[0]):money(c.price[0])+' <small>to</small> '+money(c.price[1])}</div>
  <div class="stats">
    <div class="stat"><small>Bedrooms</small><b>${c.beds[0]}–${c.beds[1]}</b></div>
    <div class="stat"><small>Baths</small><b>${c.baths[0]===c.baths[1]?c.baths[0]:c.baths[0]+'–'+c.baths[1]}</b></div>
    <div class="stat"><small>Sq ft</small><b>${fmt(c.sf[0])}–${fmt(c.sf[1])}</b></div>
    <div class="stat"><small>HOA</small><b>$${c.hoa}/mo</b></div>
    <div class="stat" style="grid-column:span 2"><small>${c.status==='soon'?'Homesites planned':c.status==='sold'?'Homesites':'Homesites left'}</small><b>${c.status==='soon'||c.status==='sold'?c.total:c.left+' of '+c.total}</b>${c.status==='now'||c.status==='final'?`<div class="meter" aria-hidden="true"><i style="width:${Math.round(sold/c.total*100)}%"></i></div>`:''}</div>
  </div>
  <ul class="hl">${c.hl.map(x=>`<li>${x}</li>`).join('')}</ul>
  <p class="h3">Drive times</p>
  <div class="times">${times.map(({d,t})=>`<button class="time ${state.dest===d.id?'on':''}" data-d="${d.id}"><svg viewBox="0 0 24 24">${ICON[d.ic]}</svg><span>${d.name}<br><small>${t.mi.toFixed(1)} mi</small></span><b>${t.min} min</b></button>`).join('')}</div>
  <p class="h3">Nearby</p>
  <div class="times">${[[sch,'school'],[groc,'cart'],[park,'tree']].map(([n,ic])=>`<div class="time" style="cursor:default"><svg viewBox="0 0 24 24">${ICON[ic]}</svg><span>${n.p.name}</span><b>${n.t.mi.toFixed(1)} mi</b></div>`).join('')}</div>
  <div class="sub" style="margin:-8px 0 0;font-size:12px">${c.district}</div>`;
  if(showPlan)h+=`<a class="cta ghost" href="${SITEPLAN_URL}" target="_blank" rel="noopener">Open the interactive site plan</a>`;
  if(c.status!=='sold')h+=`<form novalidate><p class="h3">${c.status==='soon'?'Join the interest list':'Schedule a tour'}</p>
    <div class="two"><div class="field"><label for="f-name">Name</label><input id="f-name" required autocomplete="name" value="Taylor Brooks"></div>
    <div class="field"><label for="f-email">Email</label><input id="f-email" type="email" required autocomplete="email" value="taylor@example.com"></div></div>
    ${c.status==='soon'?'':`<div class="two"><div class="field"><label for="f-day">Day</label><select id="f-day"><option>Saturday</option><option>Sunday</option><option>Weekday</option></select></div><div class="field"><label for="f-time">Time</label><select id="f-time"><option>10:00 am</option><option>1:00 pm</option><option>4:00 pm</option></select></div></div>`}
    <button class="cta" type="submit">${c.status==='soon'?'Join the interest list':'Request a tour'}</button></form>`;
  const body=document.getElementById('dBody');body.innerHTML=h;body.scrollTop=0;
  body.querySelectorAll('.time[data-d]').forEach(b=>b.addEventListener('click',()=>{state.dest=b.dataset.d;setPressed(state.dest);refresh();renderDetail(c)}));
  const f=body.querySelector('form');
  if(f)f.addEventListener('submit',e=>{e.preventDefault();if(!f.reportValidity())return;const n=f.querySelector('#f-name').value.split(' ')[0].replace(/[<>&]/g,'');
    f.outerHTML=`<div class="done"><b>Thanks, ${n}. Tour request ready for ${c.name}.</b><p>This is a demo, so nothing was sent. On a live site the request goes to the community's sales team with the date, time and community attached.</p></div>`});
}

// route + ring for the selected community
function drawRoute(){
  if(routeLine){routeLine.remove();routeLine=null}
  if(ringLayer){ringLayer.remove();ringLayer=null}
  if(ringLabel){ringLabel.remove();ringLabel=null}
  if(!state.sel)return;const c=COMM.find(x=>x.id===state.sel),d=destXY();
  const mid=[(c.xy[0]+d[0])/2,(c.xy[1]+d[1])/2],dx=d[0]-c.xy[0],dy=d[1]-c.xy[1];
  const ctrl=[mid[0]-dy*.18,mid[1]+dx*.18];const pts=[];
  for(let i=0;i<=40;i++){const t=i/40;pts.push([(1-t)*(1-t)*c.xy[0]+2*(1-t)*t*ctrl[0]+t*t*d[0],(1-t)*(1-t)*c.xy[1]+2*(1-t)*t*ctrl[1]+t*t*d[1]])}
  routeLine=add(L.polyline(pts.map(ll),{className:'route',interactive:false}));
  ringLayer=add(L.circle(ll(c.xy),{radius:15/60*MPH/MI/ROADF,className:'ring',interactive:false}));
  ringLayer.bringToBack();
  ringLabel=lbl([c.xy[0],c.xy[1]+15/60*MPH/MI/ROADF+14],'About 15 min by car','ringlbl');
}

// compare
function tray(){const n=state.cmp.size;document.getElementById('tray').hidden=n<1;document.getElementById('trayTxt').textContent=n<2?`${n} selected · pick one more`:`${n} communities selected`;document.getElementById('trayGo').hidden=n<2}
let flashT;function flashTray(t){const tt=document.getElementById('trayTxt');tt.textContent=t;clearTimeout(flashT);flashT=setTimeout(tray,1600)}
document.getElementById('trayClear').addEventListener('click',()=>{state.cmp.clear();tray();renderList()});
document.getElementById('trayGo').addEventListener('click',()=>{renderCompare();document.getElementById('modal').hidden=false;document.getElementById('mClose').focus()});
function closeModal(){document.getElementById('modal').hidden=true}
document.getElementById('mClose').addEventListener('click',closeModal);
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function renderCompare(){
  const cs=[...state.cmp].map(id=>COMM.find(c=>c.id===id));
  const rows=[
    ['Status',c=>STATUS[c.status]],
    ['Price',c=>c.status==='soon'?'from '+money(c.price[0]):money(c.price[0])+' – '+money(c.price[1]),c=>c.price[0],'min'],
    ['Bedrooms',c=>c.beds.join('–')],
    ['Square feet',c=>fmt(c.sf[0])+' – '+fmt(c.sf[1]),c=>c.sf[1],'max'],
    ['HOA',c=>'$'+c.hoa+'/mo',c=>c.hoa,'min'],
    ['Homesites left',c=>c.status==='now'||c.status==='final'?c.left:'—'],
    [`Drive to ${destName()}`,c=>drive(c.xy,destXY()).min+' min',c=>drive(c.xy,destXY()).min,'min'],
    ['Schools',c=>c.district],
    ['Highlights',c=>c.hl.join('<br>')],
  ];
  document.getElementById('mTable').innerHTML=`<thead><tr><th></th>${cs.map(c=>`<td>${c.name}</td>`).join('')}</tr></thead><tbody>${rows.map(([lab,f,v,dir])=>{
    let best=null;if(v){const vals=cs.map(v);best=dir==='min'?Math.min(...vals):Math.max(...vals)}
    return `<tr><th>${lab}</th>${cs.map(c=>`<td class="${v&&v(c)===best?'best':''}">${f(c)}</td>`).join('')}</tr>`}).join('')}</tbody>`;
}

// refresh everything that depends on state
function refresh(){
  priceOut.textContent=state.max>=700000?'Any price':money(state.max);
  COMM.forEach(c=>{const m=pins.get(c.id);m.setIcon(L.divIcon({className:'pinwrap',html:pinHTML(c),iconSize:[0,0]}));m.setZIndexOffset(state.sel===c.id?1000:0)});
  destMarkers.forEach((m,id)=>m.getElement()?.firstElementChild?.classList.toggle('dest',id===state.dest));
  renderList();drawRoute();
  const now=COMM.filter(c=>c.status==='now'||c.status==='final').length;
  document.getElementById('sub').textContent=`${COMM.length} communities · ${now} selling now · sorted by drive time to ${destName()}`;
  if(state.sel&&detail.classList.contains('open')){detail.querySelectorAll('.time[data-d]').forEach(b=>b.classList.toggle('on',b.dataset.d===state.dest))}
}

const mapEl=document.getElementById('map');
map.on('zoomend',()=>{sizeRoads();mapEl.classList.toggle('far',map.getZoom()<-1.15)});
function fit(){const wide=window.innerWidth>860;map.fitBounds([[150,250],[1250,1880]],wide?{paddingTopLeft:[410,70],paddingBottomRight:[20,20]}:{padding:[40,10]})}
fit();sizeRoads();mapEl.classList.toggle('far',map.getZoom()<-1.15);
new ResizeObserver(()=>map.invalidateSize()).observe(mapEl);
refresh();
})();
</script>

</body></html>
